name: "sast-scan"

on:
  push:
    branches:
      - githubcicd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          wget https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q dependency-check-13.0.0-release.zip -d $HOME/dependency-check

      - name: Run OWASP Dependency-Check
        run: |
          chmod +x $HOME/dependency-check/dependency-check/bin/dependency-check.sh
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --project "bitcoin" \
            --nvdDatafeed 'https://open-vulnerability-data-mirror-production.up.railway.app/nvdcve-{0}.json.gz' \
            --out . \
            --scan . \
            --disableOssIndex

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: dependency-check-report.html
          if-no-files-found: error
